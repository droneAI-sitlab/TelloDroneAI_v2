<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TelloAI Dashboard</title>

    <!-- ── Stylesheet ─────────────────────────────────────────────── -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

    <!-- ── Font Awesome icons (Local) ────────────────────────────── -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}" />
</head>

<body>

<!-- ================================================================
     APP CONTAINER  –  full-height flex row
================================================================ -->
<div class="app-container">


    <!-- ============================================================
         LEFT PANEL  –  video area (proportions 3:4 of horizontal)
    ============================================================ -->
    <section class="left-panel">


        <!-- ── Battery indicator ──────────────────────────────── -->
        <div class="battery-bar" title="Livello batteria drone">

            <i class="fas fa-battery-full battery-bar__icon" id="battery-icon"></i>

            <span class="battery-bar__label">Batteria</span>

            <!-- Progress track -->
            <div class="battery-bar__track">
                <div class="battery-bar__fill" id="battery-fill"></div>
            </div>

            <span class="battery-bar__percent" id="battery-percent">— %</span>

            <!-- FPS indicator -->
            <span class="battery-bar__separator">•</span>
            <span class="battery-bar__label">FPS:</span>
            <span class="battery-bar__fps" id="fps-display">—</span>

        </div>
        <!-- /battery-bar -->


        <!-- ── Video window ───────────────────────────────────── -->
        <div class="video-window" id="video-window">

            <!-- Shown when stream is inactive -->
            <div class="video-window__placeholder" id="video-placeholder">
                <i class="fas fa-video-slash"></i>
                <span>Stream non attivo</span>
            </div>

            <!--
                MJPEG stream consumed from Flask /video_feed.
                Hidden until the stream toggle is switched ON.
            -->
            <img
                id="video-feed"
                src="{{ url_for('video_feed') }}"
                alt="Video drone"
                class="video-window__feed"
                style="display:none;"
            />

        </div>
        <!-- /video-window -->


        <!-- ── Drone control toggles (row of vertical switches) ── -->
        <div class="controls-bar">

            <!-- WiFi toggle -->
            <div class="toggle-item">
                <span class="toggle-item__label">
                    <i class="fas fa-wifi"></i> WiFi
                </span>
                <label class="toggle-switch">
                    <input
                        type="checkbox"
                        id="wifi-toggle"
                        onchange="toggleWifi(this)"
                    />
                    <span class="toggle-switch__slider"></span>
                </label>
                <span class="toggle-item__status" id="wifi-status">OFF</span>
            </div>

            <!-- Stream toggle -->
            <div class="toggle-item">
                <span class="toggle-item__label">
                    <i class="fas fa-broadcast-tower"></i> Stream
                </span>
                <label class="toggle-switch">
                    <input
                        type="checkbox"
                        id="stream-toggle"
                        onchange="toggleStream(this)"
                    />
                    <span class="toggle-switch__slider"></span>
                </label>
                <span class="toggle-item__status" id="stream-status">OFF</span>
            </div>

            <!-- Keyboard Mode toggle -->
            <div class="toggle-item">
                <span class="toggle-item__label">
                    <i class="fas fa-keyboard"></i> Tastiera
                </span>
                <label class="toggle-switch">
                    <input
                        type="checkbox"
                        id="keyboard-toggle"
                        onchange="toggleKeyboardMode(this)"
                    />
                    <span class="toggle-switch__slider"></span>
                </label>
                <span class="toggle-item__status" id="keyboard-status">OFF</span>
            </div>

            <!-- Block Takeoff from Parser toggle -->
            <div class="toggle-item">
                <span class="toggle-item__label">
                    <i class="fas fa-lock-open"></i> Pars. Takeoff
                </span>
                <label class="toggle-switch">
                    <input
                        type="checkbox"
                        id="parser-takeoff-toggle"
                        onchange="toggleParserTakeoff(this)"
                    />
                    <span class="toggle-switch__slider"></span>
                </label>
                <span class="toggle-item__status" id="parser-takeoff-status">OFF</span>
            </div>

            <!-- Separator -->
            <div class="controls-separator" style="width: 1px; background: var(--clr-border); height: 40px; margin: 0 10px;"></div>

            <!-- Direct Action Controls -->
            <div class="media-controls" style="display: flex; gap: 12px; align-items: center;">
                <button class="btn-media" id="btn-takeoff" onclick="sendDirectCommand('takeoff')" title="Decollo">
                    <i class="fas fa-arrow-up"></i>
                </button>
                <button class="btn-media" id="btn-land" onclick="sendDirectCommand('land')" title="Atterraggio">
                    <i class="fas fa-arrow-down"></i>
                </button>
                <button class="btn-media" id="btn-emergency" onclick="sendDirectCommand('emergency')" title="Emergenza" style="background: #ffebee; color: #dc3545; border-color: #f5c6cb;">
                    <i class="fas fa-exclamation-triangle"></i>
                </button>
            </div>

            <!-- Separator -->
            <div class="controls-separator" style="width: 1px; background: var(--clr-border); height: 40px; margin: 0 10px;"></div>

            <!-- Media toggles -->
            <div class="media-controls" style="display: flex; gap: 12px; align-items: center;">
                <button class="btn-media" id="btn-photo" onclick="takePhoto()" title="Scatta Screenshot">
                    <i class="fas fa-camera"></i>
                </button>
                <button class="btn-media" id="btn-record-start" onclick="startRecording()" title="Avvia Registrazione">
                    <i class="fas fa-video"></i>
                </button>
                <button class="btn-media" id="btn-record-stop" onclick="stopRecording()" title="Ferma Registrazione" style="display: none; background: #ffebee; color: #dc3545; border-color: #f5c6cb;">
                    <i class="fas fa-stop"></i>
                </button>
            </div>

        </div>
        <!-- /controls-bar -->

    </section>
    <!-- /left-panel -->


    <!-- ============================================================
         RIGHT PANEL  –  log & input (1/4 of horizontal)
    ============================================================ -->
    <aside class="right-panel">

        <!-- ── Panel header ───────────────────────────────────── -->
        <header class="right-panel__header">
            <i class="fas fa-terminal"></i>
            <span>System Log</span>
            <!-- Settings & Clear buttons -->
            <button class="settings-btn" onclick="openSettingsModal()" title="Impostazioni">
                <i class="fas fa-cog"></i>
            </button>
            <button class="clear-btn" onclick="clearLogs()" title="Svuota log">
                <i class="fas fa-trash-alt"></i>
            </button>
        </header>

        <!-- ── Scrollable log box ─────────────────────────────── -->
        <div class="log-box" id="log-box">
            <!-- Entries injected by JS -->
            <div class="log-entry log-system">
                <span class="log-time">[--:--:--]</span>
                <span class="log-msg">TelloAI Dashboard pronto</span>
            </div>
        </div>

        <!-- ── Text input area ────────────────────────────────── -->
        <div class="input-area">

            <!-- Row: text field + mic button -->
            <div class="input-area__row">
                <input
                    type="text"
                    id="message-input"
                    class="input-area__field"
                    placeholder="Scrivi un comando o un messaggio…"
                    onkeydown="handleInputKey(event)"
                    autocomplete="off"
                />
                <!-- Round microphone button -->
                <button
                    class="btn-mic"
                    id="mic-btn"
                    onclick="toggleMic()"
                    title="Inserimento vocale"
                    aria-label="Attiva microfono"
                >
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <!-- Send button -->
            <button class="btn-send" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i> Invia
            </button>

        </div>
        <!-- /input-area -->

    </aside>
    <!-- /right-panel -->



</div>
<!-- /app-container -->


<!-- ================================================================
     SETTINGS MODAL
================================================================ -->
<div id="settings-modal" class="settings-modal" style="display: none;">
    <div class="settings-modal__overlay" onclick="closeSettingsModal()"></div>
    
    <div class="settings-modal__content">
        <!-- ── Header ────────────────────────────────────────── -->
        <div class="settings-modal__header">
            <h2>Impostazioni</h2>
            <button class="settings-modal__close" onclick="closeSettingsModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <!-- ── Body (scrollable form) ────────────────────────── -->
        <div class="settings-modal__body" id="settings-form-container">
            <!-- Form fields will be generated by JS -->
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i> Caricamento impostazioni…
            </div>
        </div>
        
        <!-- ── Footer (buttons) ──────────────────────────────– -->
        <div class="settings-modal__footer">
            <button class="btn-cancel" onclick="closeSettingsModal()">
                <i class="fas fa-times"></i> Annulla
            </button>
            <button class="btn-save" onclick="saveSettings()">
                <i class="fas fa-save"></i> Salva
            </button>
        </div>
    </div>
</div>
<!-- /settings-modal -->

<!-- ── Frontend logic ─────────────────────────────────────────────── -->
<script src="{{ url_for('static', filename='js/main.js', v='20260414-logclear-1') }}"></script>

</body>
</html>
